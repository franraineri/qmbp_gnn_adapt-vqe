[project]
name = "qmbp-gnn-hva"
version = "6.0.0"
description = "Hybrid GNN-HVA Framework for Topological Phase Characterization"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["E402"]
"src/poc/v6/smoke_test.py" = ["E402"]
# Notebooks: allow star imports, reimports, undefined names (magics), module-level imports
"*.ipynb" = ["F401", "F403", "F405", "F811", "E402", "B018"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"qiskit.opflow".msg = "Deprecated: use qiskit.quantum_info.SparsePauliOp"
"qiskit.algorithms".msg = "Deprecated: use qiskit_algorithms (standalone package)"
"qiskit.utils.QuantumInstance".msg = "Deprecated: use Primitives V2"
"qiskit.execute".msg = "Deprecated: use StatevectorEstimator or EstimatorV2"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual adoption
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "6.1.0"
tag_format = "v$version"
# Conventional commits with optional scope
# Recommended scopes: phase1, phase2, phase3, phase4, mpnn, hva, vqe,
#   hamiltonian, hardware, analysis, pipeline, notebook, benchmark, thesis, config
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(.+\\))?!?:\\s.+"
allowed_prefixes = ["Merge", "Revert", "WIP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
