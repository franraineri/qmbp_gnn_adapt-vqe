[project]
name = "qmbp-gnn-hva"
version = "6.0.0"
description = "Hybrid GNN-HVA Framework for Topological Phase Characterization"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["E402"]
"src/poc/v6/smoke_test.py" = ["E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"qiskit.opflow".msg = "Deprecated: use qiskit.quantum_info.SparsePauliOp"
"qiskit.algorithms".msg = "Deprecated: use qiskit_algorithms (standalone package)"
"qiskit.utils.QuantumInstance".msg = "Deprecated: use Primitives V2"
"qiskit.execute".msg = "Deprecated: use StatevectorEstimator or EstimatorV2"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual adoption
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
