# Pre-commit hooks for GNN-HVA thesis project
# Install: pre-commit install && pre-commit install --hook-type commit-msg
# Run all: pre-commit run --all-files

repos:
  # ── Standard hooks ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-json
      - id: detect-private-key

  # ── Security: Secrets detection (IBM tokens, API keys) ─────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks

  # ── Ruff (linting + formatting) ────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        exclude: '^archive/'
      - id: ruff-format
        types_or: [python, pyi]
        exclude: '^archive/'

  # ── Notebook output stripping ──────────────────────────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: '\.ipynb$'
        exclude: '^archive/'

  # ── Notebook linting (same ruff rules as source) ───────────
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: '^archive/'

  # ── Documentation: Markdown linting (pure Python, no node) ─
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.25
    hooks:
      - id: pymarkdown
        args: [
          --config, .pymarkdown.json,
          scan
        ]
        files: '^documentation/.*\.md$'

  # ── Project-specific: HVA depth guard ──────────────────────
  - repo: local
    hooks:
      - id: hva-depth-guard
        name: HVA depth guard (p ≤ 2, Mele et al.)
        entry: scripts/hooks/check_hva_depth.py
        language: python
        files: '\.py$'
        exclude: '^archive/'
        pass_filenames: true

  # ── Project-specific: No HEA circuits ─────────────────────
  - repo: local
    hooks:
      - id: no-hea-guard
        name: No HEA circuits (HVA only)
        entry: scripts/hooks/check_no_hea.py
        language: python
        files: '\.py$'
        exclude: '^(scripts/hooks/|archive/)'
        pass_filenames: true

  # ── Project-specific: Fidelity threshold ≥ 0.93 ───────────
  # Note: model_registry.py is excluded because heisenberg/xy models
  # legitimately use fidelity_threshold=0.60 (documented in project-status.md).
  # experiments/ excluded because experiments override thresholds for testing.
  - repo: local
    hooks:
      - id: fidelity-threshold-guard
        name: Fidelity threshold ≥ 0.93
        entry: scripts/hooks/check_fidelity_threshold.py
        language: python
        files: '\.py$'
        exclude: '^(scripts/hooks/|experiments/|tests/|archive/|src/qmbp_simulation/models/model_registry\.py)'
        pass_filenames: true

  # ── Project-specific: Primitives V2 only ───────────────────
  - repo: local
    hooks:
      - id: primitives-v2-guard
        name: Primitives V2 only (no deprecated V1)
        entry: scripts/hooks/check_primitives_v2.py
        language: python
        files: '\.py$'
        exclude: '^(scripts/hooks/|archive/)'
        pass_filenames: true
